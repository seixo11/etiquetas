<title>Etiquetas de envío</title>
<style>
:root{--rojo:#e52421;--fondo:#f4f4f5;--panel:#fff;--txt:#1d1d1f;--sub:#6b6b70;--borde:#d9d9de}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;

h1{font-size:17px;font-weight:600;margin:0 0 18px}

button{width:100%;margin-top:12px;padding:10px;border:0;border-radius:8px;background:var(--rojo);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--rojo);font-size:13px;min-height:18px;margin:10px 0 0}
small{display:block;color:var(--sub);font-size:12px;margin-top:8px}
</style></head>
